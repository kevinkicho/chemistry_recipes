# Firebase App Hosting — Next.js app root is `web/` (see firebase.json rootDir).
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# AI is INTEGRAL: dual-view Ollama synthesis structures densified free-public harvest.
# Set the cloud key once:
#   npx firebase-tools@latest apphosting:secrets:set OLLAMA_CLOUD_API_KEY --project chemistryrecipes
# then grant the backend access when prompted / via Console → App Hosting → Secrets.

runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Public Firebase web config can be set here or in the App Hosting console.
# Secrets (Admin keys, Ollama) must use Secret Manager — never plain values for private keys.
env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: chemistryrecipes
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: chemistryrecipes.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: chemistryrecipes.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  # Optional: complete client Firebase if Auth UI is enabled on App Hosting
  # - variable: NEXT_PUBLIC_FIREBASE_API_KEY
  #   secret: NEXT_PUBLIC_FIREBASE_API_KEY
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_APP_ID
  #   secret: NEXT_PUBLIC_FIREBASE_APP_ID
  #   availability: [BUILD, RUNTIME]
  # - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  #   secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  #   availability: [BUILD, RUNTIME]

  # ── AI (integral dual-view) ──────────────────────────────────────
  # Uncomment after: firebase apphosting:secrets:set OLLAMA_CLOUD_API_KEY --project chemistryrecipes
  - variable: OLLAMA_CLOUD_API_KEY
    secret: OLLAMA_CLOUD_API_KEY
    availability:
      - RUNTIME
  - variable: OLLAMA_CLOUD_HOST
    value: https://ollama.com
    availability:
      - RUNTIME
  - variable: OLLAMA_CLOUD_MODEL
    value: gpt-oss:120b
    availability:
      - RUNTIME
